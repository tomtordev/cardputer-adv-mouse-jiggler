; Mouse Jiggler - Cardputer ADV
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[env:cardputer-adv]
platform = espressif32@^6.9.0
board = m5stack-stamps3
framework = arduino

; Native USB in TinyUSB (OTG) mode so the device can enumerate as a HID mouse.
; The board file forces ARDUINO_USB_MODE=1 (USB-Serial-JTAG), so we override it here.
; CDC is created manually in usb_mouse.cpp so the USB product name can be set
; from saved settings before the USB stack starts.
board_build.extra_flags =
  -DARDUINO_M5Stack_StampS3
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1

; Lets `pio run -t upload` reset the board into the bootloader through the USB CDC port.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -DFW_VERSION=\"1.0.0\"

extra_scripts =
  pre:scripts/strip_paths.py
  post:scripts/merge_bin.py

monitor_speed = 115200
upload_speed = 921600

lib_deps =
  m5stack/M5Cardputer@^1.1.1
  h2zero/NimBLE-Arduino@^2.3.0
